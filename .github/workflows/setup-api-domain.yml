name: Deploy Backend to VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend env and latest code to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_ENV: ${{ secrets.VPS_BACKEND_ENV }}
        with:
          host: 165.101.251.199
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: BACKEND_ENV
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p /opt/vyaha/backend /opt/vyaha/repo
            if [ ! -d /opt/vyaha/repo/.git ]; then
              git clone --depth 1 https://github.com/Jeevansomu0221/NearU.git /opt/vyaha/repo
            else
              cd /opt/vyaha/repo && git fetch --depth 1 origin main && git reset --hard origin/main
            fi
            rsync -a --delete /opt/vyaha/repo/backend/ /opt/vyaha/backend/ --exclude node_modules --exclude dist --exclude .env
            printf '%s' "$BACKEND_ENV" > /opt/vyaha/backend/.env
            cd /opt/vyaha/backend
            npm ci
            npm run build
            pm2 delete vyaha-backend || true
            pm2 start dist/server.js --name vyaha-backend --cwd /opt/vyaha/backend --update-env
            pm2 save
            sleep 3
            grep -E '^(RAZORPAY_KEY_ID|API_BASE_URL)=' /opt/vyaha/backend/.env
            curl -fsS http://127.0.0.1:5000/health
            curl -fsS http://127.0.0.1:5000/health/razorpay
            curl -fsS https://api.vyaha.com/health/razorpay
