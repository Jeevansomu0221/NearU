name: Setup API Domain SSL

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSL, nginx, and backend env on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_ENV: ${{ secrets.VPS_BACKEND_ENV }}
        with:
          host: 165.101.251.199
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: BACKEND_ENV
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p /opt/vyaha/backend /opt/vyaha/repo
            if [ ! -d /opt/vyaha/repo/.git ]; then
              git clone --depth 1 https://github.com/Jeevansomu0221/NearU.git /opt/vyaha/repo
            else
              cd /opt/vyaha/repo && git fetch --depth 1 origin main && git reset --hard origin/main
            fi
            printf '%s' "$BACKEND_ENV" > /opt/vyaha/backend/.env
            bash /opt/vyaha/repo/scripts/setup-api-domain.sh
            cd /opt/vyaha/backend
            pm2 restart vyaha-backend || pm2 start dist/server.js --name vyaha-backend --cwd /opt/vyaha/backend
            pm2 save
            curl -fsS http://127.0.0.1/health
            curl -fsS https://api.vyaha.com/health || curl -fsS http://api.vyaha.com/health
