name: Debug VPS Logs
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch recent delivery errors
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: "165.101.251.199"
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          command_timeout: 2m
          script: |
            set -euo pipefail
            echo "=== pm2 list ==="
            pm2 list || true
            echo "=== recent updateDeliveryStatus / delivery errors ==="
            pm2 logs --nostream --lines 300 2>/dev/null | grep -iE "updateDeliveryStatus|Failed to update delivery|CastError|ValidationError|COD|CashLedger|MongoServerError|TypeError" | tail -n 100 || true
            echo "=== last 100 backend lines ==="
            pm2 logs --nostream --lines 100 2>/dev/null | tail -n 100 || true
            echo "=== deploy marker ==="
            grep -n "codCollectedAmount = totalCodAmount\|Ask the customer to refresh" /opt/vyaha/backend/dist/controllers/order.controller.js | head -8 || true
