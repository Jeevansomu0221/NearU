name: Deploy Backend to VPS

on:
  workflow_dispatch:
    inputs:
      host:
        description: VPS IP or hostname
        required: true
        default: "165.101.251.199"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ github.event.inputs.host }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR=/opt/vyaha/backend
            mkdir -p "$APP_DIR" /opt/vyaha/repo
            if [[ ! -d /opt/vyaha/repo/.git ]]; then
              git clone --depth 1 https://github.com/Jeevansomu0221/NearU.git /opt/vyaha/repo
            fi
            cd /opt/vyaha/repo
            git fetch --depth 1 origin main
            git reset --hard origin/main
            rsync -a --delete backend/ "$APP_DIR/" --exclude node_modules --exclude dist
            printf '%s' "${{ secrets.VPS_BACKEND_ENV }}" > "$APP_DIR/.env"
            sed -i '/^GOOGLE_MAPS_API_KEY=/d' "$APP_DIR/.env"
            printf '\nGOOGLE_MAPS_API_KEY=%s\n' "${{ secrets.GOOGLE_MAPS_API_KEY }}" >> "$APP_DIR/.env"
            bash /opt/vyaha/repo/scripts/vps-deploy-backend.sh
            # Cloudflare Full SSL needs origin :443 — restore certs if deploy left HTTP-only
            bash /opt/vyaha/repo/scripts/restore-api-ssl.sh
            curl -fsS http://127.0.0.1:5000/health
            curl -fsS http://127.0.0.1/health/eko || true
            curl -fsSk https://127.0.0.1/health -H 'Host: api.vyaha.com' || true
            ss -lnt | grep -E ':80|:443|:5000' || true
            bash /opt/vyaha/repo/scripts/vps-check-google-maps.sh "$APP_DIR/.env" || true
