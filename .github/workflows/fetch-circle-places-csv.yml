name: Fetch circle Places CSV

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download CSV from VPS via scp
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p out
          sshpass -e scp -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@165.101.251.199:/tmp/circle_places_google.csv" \
            out/circle_places_google.csv
          wc -l out/circle_places_google.csv
          head -n 3 out/circle_places_google.csv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: circle-places-google
          path: out/circle_places_google.csv
          if-no-files-found: error
